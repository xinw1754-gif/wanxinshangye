  } else {
    optionsHTML = q.options.map(o => `
      <div class="opt ${ans===o.key?'selected':''}" onclick="selectOpt('${q.id}', '${o.key}')">${o.text}</div>
    `).join('');
  }

  const canNext = q.type === 'text' || q.type === 'contact' ? true : !!ans;

  app.innerHTML = `
    <div class="card">
      <div class="progress">第 ${idx+1} / ${total} 题</div>
      <div class="bar"><div class="bar-inner" style="width:${(idx/total)*100}%"></div></div>
      <div class="q-title">${q.title}</div>
      ${optionsHTML}
      <button class="btn" ${canNext?'':'disabled'} onclick="nextQ()">${idx===total-1?'提交并查看报告':'下一题'}</button>
    </div>
  `;
}

function selectOpt(qid, key) {
  state.answers[qid] = key;
  render();
}
function setText(qid, val) {
  state.answers[qid] = val;
  // 不重新渲染，避免失焦
}
function nextQ() {
  if (state.stepIndex < QUESTIONS.length - 1) {
    state.stepIndex++;
    render();
  } else {
    finishQuiz();
  }
}

// ========== 算分 ==========
function calcScores() {
  const scores = { O:0, P:0, R:0, E:0, S:0 };
  QUESTIONS.forEach(q => {
    if (q.type === 'info' || q.type === 'text' || q.type === 'contact') return;
    if (!q.options) return;
    const key = state.answers[q.id];
    const opt = q.options.find(o => o.key === key);
    if (opt && opt.scores) {
      Object.keys(opt.scores).forEach(k => { scores[k] += opt.scores[k]; });
    }
  });
  const pct = {};
  Object.keys(scores).forEach(k => {
    pct[k] = Math.round(scores[k] / MAX_SCORES[k] * 100);
  });
  return pct;
}

function getType(pct) {
  const sorted = Object.keys(pct).sort((a,b) => pct[b]-pct[a]);
  const first = sorted[0], second = sorted[1];
  const key1 = first+'+'+second, key2 = second+'+'+first;
  return TYPES[key1] || TYPES[key2] || { name:'综合型', desc:'你具备多种商业特质，建议结合自己的兴趣和资源，选择最适合的方向。', dirs:['结合自身优势探索'] };
}

// ========== 生成报告 ==========
function finishQuiz() {
  state.result = { pct: calcScores() };
  state.result.type = getType(state.result.pct);
  state.step = 2;
  render();
  submitToFeishu();
}

function renderReport(app) {
  const { pct, type } = state.result;
  const dirsHTML = type.dirs.map(d => `<div class="dir-item">· ${d}</div>`).join('');
  app.innerHTML = `
    <div class="card">
      <div class="type-name">${type.name}</div>
      <div class="type-desc">${type.desc}</div>

      <div class="section-title">你的五维得分</div>
      <canvas id="radar" class="radar"></canvas>

      <div class="section-title">推荐方向</div>
      ${dirsHTML}

      <div class="section-title">你当前最需要解决的</div>
      <div class="dir-item">${getAdvice()}</div>

      <div class="section-title">想获得完整报告？</div>
      <p class="hint">留个联系方式，我们会把完整分析发给你（非必填）。</p>
      <input type="text" id="contact" placeholder="手机号 / 微信号">
      <button class="btn" onclick="saveContact()">提交</button>
    </div>
  `;
  drawRadar(pct);
}

function getAdvice() {
  const q28 = state.answers['q28'];
  const map = { A:'先做自我认知梳理', B:'优先学一项能变现的技能', C:'先找到一个可验证的小机会', D:'先找到 1-2 个靠谱的合作者', E:'别想了，先动手做一件小事' };
  return map[q28] || '先从小事开始行动';
}

function drawRadar(pct) {
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 280;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);

  const cx = w/2, cy = h/2, r = 90;
  const keys = ['O','P','R','E','S'];
  const labels = ['机会','专业','资源','执行','系统'];
  const angleStep = Math.PI * 2 / 5;
  const startAngle = -Math.PI / 2;

  // 网格
  ctx.strokeStyle = '#262626';
  for (let level = 1; level <= 4; level++) {
    ctx.beginPath();
    for (let i = 0; i <= 5; i++) {
      const a = startAngle + angleStep * i;
      const rr = r * level / 4;
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // 轴线
  for (let i = 0; i < 5; i++) {
    const a = startAngle + angleStep * i;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
    ctx.stroke();
  }
  // 数据
  ctx.beginPath();
  ctx.fillStyle = 'rgba(212,175,55,0.25)';
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 2;
  for (let i = 0; i <= 5; i++) {
    const idx = i % 5;
    const a = startAngle + angleStep * idx;
    const val = pct[keys[idx]] / 100;
    const x = cx + Math.cos(a) * r * val;
    const y = cy + Math.sin(a) * r * val;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 标签
  ctx.fillStyle = '#888';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 5; i++) {
    const a = startAngle + angleStep * i;
    const x = cx + Math.cos(a) * (r + 20);
    const y = cy + Math.sin(a) * (r + 20);
    ctx.fillText(labels[i] + ' ' + pct[keys[i]] + '%', x, y);
  }
}

// ========== 提交到飞书 ==========
async function submitToFeishu() {
  try {
    const tokenRes = await fetch('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app_id: CONFIG.APP_ID, app_secret: CONFIG.APP_SECRET })
    });
    const tokenData = await tokenRes.json();
    const token = tokenData.tenant_access_token;

    const fields = {
      '年龄': state.answers['q1'] || '',
      '状态': state.answers['q2'] || '',
      '类型': state.result.type.name,
      '答案详情': JSON.stringify(state.answers),
      '得分': JSON.stringify(state.result.pct)
    };

    await fetch(`https://open.feishu.cn/open-apis/bitable/v1/apps/${CONFIG.APP_TOKEN}/tables/${CONFIG.TABLE_ID}/records`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ fields })
    });
  } catch (e) {
    console.error('提交失败', e);
  }
}

async function saveContact() {
  const contact = document.getElementById('contact').value.trim();
  if (!contact) { alert('已提交，感谢参与！'); return; }
  try {
    const tokenRes = await fetch('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app_id: CONFIG.APP_ID, app_secret: CONFIG.APP_SECRET })
    });
    const tokenData = await tokenRes.json();
    const token = tokenData.tenant_access_token;

    const fields = {
      '时间': Date.now(),
      '年龄': state.answers['q1'] || '',
      '状态': state.answers['q2'] || '',
      '类型': state.result.type.name,
      '联系方式': contact,
      '答案详情': JSON.stringify(state.answers),
      '得分': JSON.stringify(state.result.pct)
    };

    await fetch(`https://open.feishu.cn/open-apis/bitable/v1/apps/${CONFIG.APP_TOKEN}/tables/${CONFIG.TABLE_ID}/records`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ fields })
    });
    alert('提交成功，感谢参与！');
  } catch (e) {
    alert('提交成功，感谢参与！');
  }
}

render();
</script>
